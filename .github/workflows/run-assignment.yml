name: Run Assignment 3 Notebooks and Export Deliverables

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt openpyxl jupyter nbconvert

      - name: Generate raw CSV datasets
        run: python generate_data.py

      - name: Export branch summary Excel file
        run: |
          python -c '
          import os
          import pandas as pd

          df = pd.read_csv("duka_sales.csv")
          print("Columns in duka_sales.csv:", list(df.columns))

          candidates = ["revenue", "total_revenue", "sales_amount", "total_amount", "order_total", "amount", "total"]
          rev_col = next((c for c in candidates if c in df.columns), None)

          if rev_col is None and {"quantity", "unit_price"}.issubset(df.columns):
              df["revenue"] = pd.to_numeric(df["quantity"], errors="coerce") * pd.to_numeric(df["unit_price"], errors="coerce")
              rev_col = "revenue"
          elif rev_col is None:
              raise ValueError(f"Could not find a revenue column in {list(df.columns)}")

          df["revenue"] = pd.to_numeric(df[rev_col], errors="coerce")

          branch_col = next((c for c in ["branch", "store", "location", "region"] if c in df.columns), None)
          channel_col = next((c for c in ["channel", "sales_channel", "order_channel"] if c in df.columns), None)

          if branch_col is None:
              raise ValueError(f"Could not find a branch column in {list(df.columns)}")

          branch_summary = (
              df.groupby(branch_col, dropna=False)["revenue"]
              .agg(total_revenue="sum", order_count="count", avg_order_value="mean")
              .reset_index()
          )

          os.makedirs("excel", exist_ok=True)
          with pd.ExcelWriter("excel/duka_branch_summary.xlsx", engine="openpyxl") as writer:
              branch_summary.to_excel(writer, sheet_name="branch_summary", index=False)
              if channel_col:
                  branch_channel_pivot = pd.pivot_table(
                      df,
                      values="revenue",
                      index=branch_col,
                      columns=channel_col,
                      aggfunc="sum",
                      fill_value=0,
                  )
                  branch_channel_pivot.to_excel(writer, sheet_name="branch_channel_revenue")
          print("Exported excel/duka_branch_summary.xlsx using column:", rev_col)
          '

      - name: Execute notebooks and save outputs
        run: |
          jupyter nbconvert --to notebook --execute --inplace duka_sales_exploration.ipynb
          jupyter nbconvert --to notebook --execute --inplace agent_cleanup.ipynb

      - name: Commit executed notebooks and generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f duka_sales_exploration.ipynb agent_cleanup.ipynb outputs/ excel/duka_branch_summary.xlsx
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Run Assignment 3 notebooks and export deliverables"
            git push
          fi
